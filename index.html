<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="shopify-api-key" content="e9715be4c0a937485ee6c34186ce7d2b">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<title>Varemodtagelse</title>
<style>
/* Varemodtagelse til PMU Supply (18. okt 2026). Indlejret app i Shopify: åbnes i Shopify-appen på telefonen.
   Scan stregkoden → varen vises → tast antal → Gem. Kun eksisterende varer; appen opretter aldrig varer.
   Alle kald går direkte til Shopify som den medarbejder, der er logget ind (App Bridge «direct API access»).
   Lokalt: node server.mjs → http://localhost:4911/?lokal (kald går via serverens token; kun til afprøvning). */
:root { --bund: #f4f2f0; --kort: #fff; --blaek: #1f1b19; --blid: #6b625e; --linje: #e4dfdb; --roed: #9a0f1f; --groen: #1a7f37; --gul: #fff4d6; --guld: #b08a4e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bund); color: var(--blaek); font: 16px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
h1 { font-size: 22px; margin: 4px 0 2px; }
.lokation { color: var(--blid); font-size: 14px; margin-bottom: 16px; }
.lokation select { font: inherit; border: 0; background: none; color: var(--blaek); font-weight: 600; }
.kort { background: var(--kort); border-radius: 16px; padding: 18px; box-shadow: 0 1px 0 rgba(0, 0, 0, .05), 0 0 0 1px var(--linje); margin-bottom: 14px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 14px; }
.scan { width: 100%; background: var(--blaek); color: #fff; font-size: 20px; font-weight: 700; padding: 22px; display: flex; align-items: center; justify-content: center; gap: 12px; }
.scan svg { width: 30px; height: 30px; }
.manuel { display: flex; gap: 8px; margin-top: 12px; }
.manuel input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 13px 14px; border: 1px solid var(--linje); border-radius: 12px; background: #fff; }
.manuel button, .lys { background: #ece8e5; color: var(--blaek); font-weight: 600; padding: 13px 16px; }
.vare { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; }
.vare img, .vare .ingen { width: 84px; height: 84px; object-fit: contain; border-radius: 12px; background: var(--bund); }
.vare h2 { font-size: 17px; margin: 0 0 4px; line-height: 1.3; }
.meta { font-size: 13px; color: var(--blid); }
.lager { display: flex; gap: 10px; margin: 16px 0 6px; }
.lager div { flex: 1; background: var(--bund); border-radius: 12px; padding: 10px 12px; }
.lager b { display: block; font-size: 26px; line-height: 1.1; }
.lager span { font-size: 12px; color: var(--blid); }
.tilstand { display: grid; grid-template-columns: 1fr 1fr; background: var(--bund); border-radius: 12px; padding: 4px; margin: 16px 0 14px; }
.tilstand button { background: none; padding: 10px; font-weight: 600; color: var(--blid); border-radius: 9px; }
.tilstand button.valgt { background: #fff; color: var(--blaek); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.antal { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center; }
.antal button { height: 64px; font-size: 30px; font-weight: 600; background: #ece8e5; }
.antal input { width: 100%; text-align: center; font-family: inherit; font-size: 34px; font-weight: 700; line-height: 1; padding: 10px 0; border: 2px solid var(--blaek); border-radius: 14px; }
.hjaelp { font-size: 13px; color: var(--blid); margin: 10px 0 0; text-align: center; }
.gem { width: 100%; background: var(--roed); color: #fff; font-size: 19px; font-weight: 700; padding: 18px; margin-top: 16px; }
.gem:disabled { opacity: .5; }
.besked { border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; font-size: 15px; }
.besked.ok { background: #e3f4e8; color: #0f5a26; }
.besked.fejl { background: #fde8e8; color: #8a1414; }
.besked.info { background: var(--gul); color: #6b4d00; }
.besked b { display: block; font-size: 17px; margin-bottom: 2px; }
.liste { list-style: none; margin: 10px 0 0; padding: 0; }
.liste li + li { border-top: 1px solid var(--linje); }
.liste button { width: 100%; text-align: left; background: none; padding: 12px 4px; border-radius: 0; display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.liste img, .liste .ingen { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: var(--bund); }
.liste .navn { font-weight: 600; font-size: 15px; display: block; line-height: 1.3; }
.historik { font-size: 14px; }
.historik li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; }
.historik li + li { border-top: 1px solid var(--linje); }
.skjult { display: none !important; }
h3 { font-size: 15px; margin: 0 0 4px; }
.knapper { display: flex; gap: 10px; margin-top: 14px; }
.knapper button { flex: 1; padding: 14px; font-weight: 600; }
.primaer { background: var(--blaek); color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Varemodtagelse</h1>
  <div class="lokation" id="lokation">Henter lager …</div>

  <div id="besked"></div>

  <!-- 1. scan -->
  <section class="kort" id="trinScan">
    <button class="scan" id="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Scan stregkode</button>
    <form class="manuel" id="manuel"><input id="kode" inputmode="numeric" autocomplete="off" placeholder="… eller skriv stregkoden"><button>Find</button></form>
  </section>

  <!-- 2. varen og antal -->
  <section class="kort skjult" id="trinVare">
    <div class="vare" id="vare"></div>
    <div class="lager"><div><b id="nu">–</b><span>på lager nu</span></div><div><b id="efter">–</b><span id="efterTekst">efter gem</span></div></div>
    <div class="tilstand" role="tablist"><button type="button" id="tilLaeg" class="valgt">Varer modtaget</button><button type="button" id="tilSaet">Optælling</button></div>
    <div class="antal"><button type="button" id="minus" aria-label="Færre">−</button><input id="antal" type="number" inputmode="numeric" min="0" value="1"><button type="button" id="plus" aria-label="Flere">+</button></div>
    <p class="hjaelp" id="hjaelp">Antallet lægges til lageret.</p>
    <button class="gem" id="gem">Gem</button>
    <div class="knapper"><button class="lys" id="fortryd">Annullér</button></div>
  </section>

  <!-- 3. ukendt stregkode: kobl til en eksisterende vare -->
  <section class="kort skjult" id="trinKobl">
    <h3>Find varen, stregkoden hører til</h3>
    <p class="meta" style="margin:0 0 4px">Søg på navn eller varenummer. Nye varer oprettes i Shopify efter bogen, ikke her.</p>
    <form class="manuel" id="soegForm"><input id="soeg" autocomplete="off" placeholder="Fx Super Brows eller varenummer"><button>Søg</button></form>
    <ul class="liste" id="resultater"></ul>
    <div class="knapper"><button class="lys" id="fortrydKobl">Annullér</button></div>
  </section>

  <section class="kort" id="historikKort">
    <h3>Gemt i denne omgang</h3>
    <ul class="liste historik" id="historik"><li class="meta">Intet endnu.</li></ul>
  </section>
</main>

<script>
const qs = new URLSearchParams(location.search), LOKAL = qs.has('lokal');
const $ = (id) => document.getElementById(id);
const API = LOKAL ? '/graphql' : 'shopify:admin/api/2026-07/graphql.json';
const nyNoegle = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gem = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const hent = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

async function gql(query, variables = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }) });
  if (!r.ok) throw new Error('Shopify svarede ' + r.status);
  const j = await r.json();
  if (j.errors && j.errors.length) throw new Error(j.errors.map((e) => e.message).join('; '));
  return j.data;
}
function besked(type, titel, tekst = '') { $('besked').innerHTML = titel ? `<div class="besked ${type}"><b>${esc(titel)}</b>${esc(tekst)}</div>` : ''; }
function vis(trin) { for (const id of ['trinScan', 'trinVare', 'trinKobl']) $(id).classList.toggle('skjult', id !== trin); }

// ---------- lager (lokation) ----------
let LOK = null;
async function hentLokationer() {
  const d = await gql(`{ locations(first: 20, includeInactive: false) { nodes { id name } } }`);
  const l = d.locations.nodes; if (!l.length) throw new Error('Butikken har intet lager');
  LOK = l.find((x) => x.id === hent('pmu-lager-lok')) || l[0];
  $('lokation').innerHTML = l.length === 1 ? `Lager: <b>${esc(LOK.name)}</b>`
    : `Lager: <select id="lokValg">${l.map((x) => `<option value="${x.id}"${x.id === LOK.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`;
  if (l.length > 1) $('lokValg').onchange = (e) => { LOK = l.find((x) => x.id === e.target.value); gem('pmu-lager-lok', LOK.id); nulstil(); };
}

// ---------- varen ----------
const VARIANT = `id title displayName sku barcode image { url } product { id title status featuredMedia { preview { image { url } } } }
  inventoryItem { id tracked inventoryLevel(locationId: $lok) { quantities(names: ["available"]) { quantity } } }`;
let VAR = null, KODE = '', TILSTAND = 'laeg';
const KOBLET = new Map(); // stregkoder koblet i denne omgang: Shopifys søgning kender dem først efter nogle sekunder
const billede = (v) => v.image?.url || v.product.featuredMedia?.preview?.image?.url;
const lagerNu = (v) => v.inventoryItem.inventoryLevel?.quantities?.[0]?.quantity;
const varenavn = (v) => v.product.title + (v.title && v.title !== 'Default Title' ? ' – ' + v.title : '');

async function findKode(kode) {
  kode = kode.trim(); if (!kode) return;
  KODE = kode; besked(); $('kode').value = '';
  try {
    const d = await gql(`query($q: String!, $lok: ID!) { productVariants(first: 10, query: $q) { nodes { ${VARIANT} } } }`, { q: `barcode:"${kode.replace(/"/g, '')}"`, lok: LOK.id });
    let fundet = d.productVariants.nodes.filter((v) => v.barcode === kode);
    if (!fundet.length && KOBLET.has(kode)) fundet = [(await gql(`query($id: ID!, $lok: ID!) { productVariant(id: $id) { ${VARIANT} } }`, { id: KOBLET.get(kode), lok: LOK.id })).productVariant].filter((v) => v && v.barcode === kode);
    if (fundet.length === 1) return visVare(fundet[0]);
    if (fundet.length > 1) { besked('info', 'Stregkoden sidder på flere varer', 'Vælg den rigtige nedenfor, og ret de andre i Shopify bagefter.'); return visListe(fundet, false); }
    besked('info', 'Ukendt stregkode: ' + kode, 'Stregkoden er ikke koblet til en vare endnu. Find varen, så gemmes stregkoden på den.');
    vis('trinKobl'); $('resultater').innerHTML = ''; $('soeg').value = ''; setTimeout(() => $('soeg').focus(), 50);
  } catch (e) { besked('fejl', 'Kunne ikke slå stregkoden op', e.message); }
}
function visVare(v) {
  VAR = v; vis('trinVare');
  const img = billede(v);
  $('vare').innerHTML = `${img ? `<img src="${esc(img)}&width=200" alt="">` : '<div class="ingen"></div>'}<div><h2>${esc(varenavn(v))}</h2>
    <div class="meta">Varenr. ${esc(v.sku || '–')} · Stregkode ${esc(v.barcode || KODE)}${v.product.status !== 'ACTIVE' ? ' · <b>' + (v.product.status === 'DRAFT' ? 'Kladde' : 'Arkiveret') + '</b>' : ''}</div></div>`;
  if (!v.inventoryItem.tracked) besked('info', 'Lageret tælles ikke på denne vare', 'Slå «Spor antal» til på varen i Shopify først.');
  else if (lagerNu(v) == null) besked('info', 'Varen er ikke på dette lager', 'Tilføj den til lageret i Shopify først.');
  saetTilstand('laeg'); $('antal').value = 1; opdater();
}
function saetTilstand(t) {
  TILSTAND = t; $('tilLaeg').classList.toggle('valgt', t === 'laeg'); $('tilSaet').classList.toggle('valgt', t === 'saet');
  $('hjaelp').textContent = t === 'laeg' ? 'Antallet lægges til lageret.' : 'Skriv det antal, der står på hylden. Lageret sættes til det.';
  $('efterTekst').textContent = t === 'laeg' ? 'efter gem' : 'efter optælling';
  if (t === 'saet' && VAR) $('antal').value = Math.max(0, lagerNu(VAR) ?? 0);
  if (t === 'laeg') $('antal').value = 1;
  opdater();
}
function opdater() {
  const nu = VAR ? lagerNu(VAR) : null, n = Math.max(0, parseInt($('antal').value, 10) || 0);
  $('nu').textContent = nu ?? '–';
  $('efter').textContent = nu == null ? '–' : TILSTAND === 'laeg' ? nu + n : n;
  $('gem').textContent = TILSTAND === 'laeg' ? `Læg ${n} stk. på lager` : `Sæt lageret til ${n} stk.`;
  $('gem').disabled = !(VAR && VAR.inventoryItem.tracked && nu != null && !(TILSTAND === 'laeg' && n === 0));
}

// ---------- gem ----------
const historik = [];
async function gemLager() {
  const v = VAR, n = Math.max(0, parseInt($('antal').value, 10) || 0), fra = lagerNu(v);
  $('gem').disabled = true; $('gem').textContent = 'Gemmer …';
  try {
    let fejl;
    if (TILSTAND === 'laeg') {
      const d = await gql(`mutation($i: InventoryAdjustQuantitiesInput!) { inventoryAdjustQuantities(input: $i) @idempotent(key: "${nyNoegle()}") { userErrors { message code } } }`,
        { i: { reason: 'received', name: 'available', changes: [{ delta: n, changeFromQuantity: fra, inventoryItemId: v.inventoryItem.id, locationId: LOK.id }] } });
      fejl = d.inventoryAdjustQuantities.userErrors;
    } else {
      const d = await gql(`mutation($i: InventorySetQuantitiesInput!) { inventorySetQuantities(input: $i) @idempotent(key: "${nyNoegle()}") { userErrors { message code } } }`,
        { i: { reason: 'correction', name: 'available', quantities: [{ quantity: n, changeFromQuantity: fra, inventoryItemId: v.inventoryItem.id, locationId: LOK.id }] } });
      fejl = d.inventorySetQuantities.userErrors;
    }
    if (fejl.length) {
      if (fejl.some((f) => f.code === 'CHANGE_FROM_QUANTITY_STALE')) { await genindlaes(); besked('info', 'Lageret er lige blevet ændret', `Der står nu ${lagerNu(VAR)} stk. Tjek antallet, og tryk Gem igen.`); return; }
      throw new Error(fejl.map((f) => f.message).join('; '));
    }
    const efter = TILSTAND === 'laeg' ? fra + n : n;
    besked('ok', TILSTAND === 'laeg' ? `${n} stk. lagt på lager` : `Lageret sat til ${n} stk.`, `${varenavn(v)} · nu ${efter} på lager`);
    historik.unshift({ navn: varenavn(v), tekst: TILSTAND === 'laeg' ? `+${n}` : `= ${n}`, efter, tid: new Date().toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' }) });
    tegnHistorik(); nulstil(false);
    if (window.shopify?.toast) shopify.toast.show(TILSTAND === 'laeg' ? `${n} stk. lagt på lager` : `Lager sat til ${n}`);
  } catch (e) { besked('fejl', 'Lageret blev ikke gemt', e.message); opdater(); }
}
async function genindlaes() {
  const d = await gql(`query($id: ID!, $lok: ID!) { productVariant(id: $id) { ${VARIANT} } }`, { id: VAR.id, lok: LOK.id });
  VAR = d.productVariant; opdater();
}
function tegnHistorik() {
  $('historik').innerHTML = historik.length ? historik.map((h) => `<li><span>${esc(h.navn)}<br><span class="meta">${h.tid} · nu ${h.efter} på lager</span></span><b>${esc(h.tekst)}</b></li>`).join('') : '<li class="meta">Intet endnu.</li>';
}
function nulstil(rydBesked = true) { VAR = null; KODE = ''; if (rydBesked) besked(); vis('trinScan'); }

// ---------- kobl en ukendt stregkode til en eksisterende vare ----------
async function soeg(tekst) {
  tekst = tekst.trim(); if (!tekst) return;
  $('resultater').innerHTML = '<li class="meta" style="padding:12px 4px">Søger …</li>';
  try {
    const ren = tekst.replace(/["\\]/g, '');
    const d = await gql(`query($q: String!, $lok: ID!) { productVariants(first: 25, query: $q) { nodes { ${VARIANT} } } }`, { q: /\s/.test(ren) ? ren : `${ren} OR sku:${ren}`, lok: LOK.id });
    visListe(d.productVariants.nodes, true);
  } catch (e) { $('resultater').innerHTML = `<li class="meta" style="padding:12px 4px">Søgningen fejlede: ${esc(e.message)}</li>`; }
}
let LISTE = [];
function visListe(varer, kobl) {
  LISTE = varer; vis('trinKobl');
  if (!kobl) $('soegForm').classList.add('skjult'); else $('soegForm').classList.remove('skjult');
  $('resultater').innerHTML = varer.length ? varer.map((v, i) => { const img = billede(v); return `<li><button data-i="${i}" data-kobl="${kobl ? 1 : 0}">${img ? `<img src="${esc(img)}&width=120" alt="">` : '<div class="ingen"></div>'}
    <span><span class="navn">${esc(varenavn(v))}</span><span class="meta">Varenr. ${esc(v.sku || '–')} · ${v.barcode ? 'har stregkode ' + esc(v.barcode) : 'ingen stregkode'} · ${lagerNu(v) ?? '–'} på lager</span></span></button></li>`; }).join('')
    : '<li class="meta" style="padding:12px 4px">Ingen varer fundet. Prøv et andet ord eller varenummeret.</li>';
}
async function kobl(v) {
  if (v.barcode && v.barcode !== KODE && !confirm(`${varenavn(v)} har allerede stregkoden ${v.barcode}.\n\nVil du erstatte den med ${KODE}?`)) return;
  if (!v.barcode && !confirm(`Gem stregkoden ${KODE} på\n${varenavn(v)}?`)) return;
  try {
    const d = await gql(`mutation($p: ID!, $v: [ProductVariantsBulkInput!]!) { productVariantsBulkUpdate(productId: $p, variants: $v) { userErrors { message } } }`, { p: v.product.id, v: [{ id: v.id, barcode: KODE }] });
    if (d.productVariantsBulkUpdate.userErrors.length) throw new Error(d.productVariantsBulkUpdate.userErrors.map((f) => f.message).join('; '));
    KOBLET.set(KODE, v.id);
    besked('ok', 'Stregkoden er gemt på varen', 'Næste gang findes varen direkte, når du scanner.');
    visVare({ ...v, barcode: KODE });
  } catch (e) { besked('fejl', 'Stregkoden blev ikke gemt', e.message); }
}

// ---------- scanner ----------
async function scan() {
  if (window.shopify?.scanner?.capture) {
    try { const { data } = await shopify.scanner.capture(); if (data) findKode(String(data)); }
    catch (e) { if (!/cancel/i.test(e?.message || '')) besked('fejl', 'Scanningen blev afbrudt', e?.message || ''); }
  } else { besked('info', 'Scanneren findes kun i Shopify-appen', 'Skriv stregkoden i feltet i stedet.'); $('kode').focus(); }
}

// ---------- knapper ----------
$('scan').onclick = scan;
$('manuel').onsubmit = (e) => { e.preventDefault(); findKode($('kode').value); };
$('soegForm').onsubmit = (e) => { e.preventDefault(); soeg($('soeg').value); };
$('resultater').onclick = (e) => { const b = e.target.closest('[data-i]'); if (!b) return; const v = LISTE[+b.dataset.i]; b.dataset.kobl === '1' ? kobl(v) : visVare(v); };
$('tilLaeg').onclick = () => saetTilstand('laeg'); $('tilSaet').onclick = () => saetTilstand('saet');
$('minus').onclick = () => { $('antal').value = Math.max(0, (parseInt($('antal').value, 10) || 0) - 1); opdater(); };
$('plus').onclick = () => { $('antal').value = (parseInt($('antal').value, 10) || 0) + 1; opdater(); };
$('antal').oninput = opdater;
$('antal').onfocus = (e) => e.target.select();
$('gem').onclick = gemLager;
$('fortryd').onclick = () => nulstil(); $('fortrydKobl').onclick = () => nulstil();

hentLokationer().catch((e) => { $('lokation').textContent = ''; besked('fejl', 'Kunne ikke forbinde til Shopify', e.message + (LOKAL ? '' : ' – er appen åbnet inde i Shopify?')); });
</script>
</body>
</html>
